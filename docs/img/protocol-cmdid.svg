width="2"/><text x="898.0" y="164" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">0</text><text x="898.0" y="198" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="normal" fill="#9ca3af" text-anchor="middle">b1</text><rect x="930" y="130" width="52" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="956.0" y="164" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">1</text><text x="956.0" y="198" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="normal" fill="#9ca3af" text-anchor="middle">b0</text><path d="M60,210 v6 H402 v-6" fill="none" stroke="#b45309" stroke-width="2"/><text x="231.0" y="232" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">高6位 = 路由位 RROTO_ROUTE_FIELD (0xFC00) → 决定落哪个 DB 库</text><path d="M466,210 v6 H518 v-6" fill="none" stroke="#15803d" stroke-width="2"/><text x="492.0" y="232" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">0x0100 = NEED_UPDATE</text><text x="492.0" y="250" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" font-weight="normal" fill="#15803d" text-anchor="middle">(置 1 = 这条要写库)</text><path d="M524,210 v6 H982 v-6" fill="none" stroke="#4338ca" stroke-width="2"/><text x="753.0" y="232" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">其余位 = 命令本体编号</text><text x="30" y="282" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start">→ 后端按 cmdid 查一张函数指针表(dispatch[cmdid])O(1) 分发;mole/dbsvr/include/proto.h 里约 1300 个命令字,约 700 个带 NEED_UPDATE。</text><text x="30" y="318" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">② 报文头 PROTO_HEADER(packed 无填充 · 小端 · 固定 18 字节,正文紧随其后)</text><rect x="40" y="338" width="142" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="111.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">proto_length</text><text x="111.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="middle">4B</text><text x="111.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">包总长度</text><rect x="190" y="338" width="172" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="276.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">proto_id</text><text x="276.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">4B</text><text x="276.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">版本/魔数 0x12345678</text><rect x="370" y="338" width="112" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="426.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">cmd_id</text><text x="426.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#6366f1" text-anchor="middle">2B</text><text x="426.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">命令字(见上)</text><rect x="490" y="338" width="112" height="64" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="546.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">result</text><text x="546.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#22c55e" text-anchor="middle">4B</text><text x="546.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">结果/错误码</text><rect x="610" y="338" width="142" height="64" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="681.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">id(米米号)</text><text x="681.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#8b5cf6" text-anchor="middle">4B</text><text x="681.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">用户编号 uint32</text><rect x="760" y="338" width="192" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="856.0" y="362" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">body[]</text><text x="856.0" y="380" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">…</text><text x="856.0" y="394" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle">私有数据/正文</text><text x="30" y="432" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">提示:请求头与响应头同构(回包直接 memcpy 原头,只改 length 与 result)。客户端↔在线服那一段还有一套十进制小命令字 + DES 加密(</text><text x="30" y="450" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">DES_KEY = "&gt;ta:mee&lt;");而 online↔DB 的内网段一般明文。对照 iOS 抓包时,先对齐"在哪一层",再比字段。</text></svg>